name: Build TLS-CRASH

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Tidy
        run: go mod tidy
      - name: Build Windows
        run: go build -ldflags "-s -w -H windowsgui" -o ALPHA-Utilities.exe .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALPHA-Utilities
          path: ALPHA-Utilities.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Tidy
        run: go mod tidy
      - name: Build Linux
        run: go build -ldflags "-s -w" -o tls-crash .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-crash-linux
          path: tls-crash
          retention-days: 7